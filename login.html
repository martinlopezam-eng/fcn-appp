<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FCN - Iniciar sesión o registrarse</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="assets/logo.png" />
</head>
<body>
  <main class="page">
    <div class="card">
      <div class="logo">
        <img src="assets/logo.svg" alt="Logo FCN" />
      </div>

      <h1>Registrarte o iniciar sesión</h1>
      <p class="subtitle">Introduce tu número y contraseña</p>

      <form id="loginForm" class="form" autocomplete="off">
        <div class="field">
          <label for="name">Nombre (opcional)</label>
          <input id="name" type="text" placeholder="Tu nombre" />
        </div>

        <div class="field">
          <label for="phone">Número de teléfono</label>
          <input id="phone" type="tel" placeholder="+57 3001234567" required />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" placeholder="Mínimo 6 caracteres" required />
        </div>

        <div class="field">
          <label for="invite">Código de invitación (opcional)</label>
          <input id="invite" type="text" placeholder="Código de invitación" />
        </div>

        <button class="btn" type="submit">Continuar</button>
        <div id="message" class="message"></div>
      </form>
    </div>
  </main>
  <script src="script.js"></script>
  <script src="login.js"></script>
</body>
</html>
