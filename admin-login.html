<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login Admin</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      width: 300px;
      text-align: center;
    }
    h2 {
      margin-bottom: 1rem;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }
    button:hover {
      background: #45a049;
    }
    #message {
      margin-top: 10px;
      color: red;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Panel Admin</h2>
    <form id="adminLoginForm">
      <input type="text" id="adminUser" placeholder="Usuario" required />
      <input type="password" id="adminPassword" placeholder="Contraseña" required />
      <button type="submit">Ingresar</button>
    </form>
    <div id="message"></div>
  </div>

  <script>
    document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const user = document.getElementById("adminUser").value.trim();
      const password = document.getElementById("adminPassword").value;

    const res = await fetch("/api/admin/login", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ user, password })
});

      const data = await res.json();

      if (data.success) {
        localStorage.setItem("adminToken", data.token);
        location.href = "admin.html";
      } else {
        document.getElementById("message").textContent = data.error || "Error en login";
      }
    });
  </script>
</body>
</html>
